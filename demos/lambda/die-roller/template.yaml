AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12

Resources:
  DieRollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      Events:
        GetRoll:
          Type: Api
          Properties:
            Path: /roll/{rollString}
            Method: get
        GetDefaultRoll:
          Type: Api
          Properties:
            Path: /roll
            Method: get